<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <!-- 字型 -->
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <!-- css -->
  <!-- reset.css -->
  <link rel="stylesheet" href="./css/reset.css">
  <!-- root.css -->
  <link rel="stylesheet" href="./css/root.css">
  <!-- style.css -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- css測試區塊開始-->
  <style>
  
  </style>
  <!-- css測試區塊結束 -->

  <!-- media.css -->
  <link rel="stylesheet" href="/css/media.css">
  
  <title>Frontend Mentor | Intro section with dropdown navigation</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <!-- 區塊1：header(放置logo,nav(table&mobile),mask) -->
  <header class="header">
    <!-- header內容 -->
    <div class="top">
      <div class="top-content">
        <!-- logo開始 -->
        <div class="logo">
          <img src="https://raw.githubusercontent.com/tina801005/FM-01-02-intro-section-with-dropdown-navigation/refs/heads/master/images/logo.svg" alt="logo snap">
        </div>
        <!-- logo結束 -->
        
        <!-- nav開始 -->
        <nav class="table-nav">
          <ul class="nav-list">
            <li class="list-arrow">
              <h3>Features</h3>
              <ul class="list-items features-items">
                <li><a href="#"><span class="item-icon"><img src="https://raw.githubusercontent.com/tina801005/FM-01-02-intro-section-with-dropdown-navigation/refs/heads/master/images/icon-todo.svg" alt="icon todo-list"></span>Todo List</a></li>
                <li><a href="#"><span class="item-icon"><img src="https://raw.githubusercontent.com/tina801005/FM-01-02-intro-section-with-dropdown-navigation/refs/heads/master/images/icon-calendar.svg" alt="icon calendar"></span>Calendar</a></li>
                <li><a href="#"><span class="item-icon"><img src="https://raw.githubusercontent.com/tina801005/FM-01-02-intro-section-with-dropdown-navigation/refs/heads/master/images/icon-reminders.svg" alt="icon reminders"></span>Reminders</a></li>
                <li><a href="#"><span class="item-icon"><img src="https://raw.githubusercontent.com/tina801005/FM-01-02-intro-section-with-dropdown-navigation/refs/heads/master/images/icon-planning.svg" alt="icon planning"></span>Planning</a></li>
              </ul>
            </li>
            <li class="list-arrow">
              <h3>Company</h3>
              <ul class="list-items company-items">
                <li><a href="#">History</a></li>
                <li><a href="#">Our Team</a></li>
                <li><a href="#">Blog</a></li>
              </ul>
            </li>
            <li><a href="#">Careers</a></li>
            <li><a href="#">About</a></li>
          </ul>
          <div class="user">
            <a href="#" class="btn-login">Login</a>
            <a href="#" class="btn-register">Register</a>
          </div>
        </nav>
        <!-- nav結束 -->
      </div>
    </div>

  </header>

  <!-- 區塊2：main(放置article及image) -->
